name: Bug 报告
description: 报告安装、连接或工具调用中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先阅读 `docs/排障手册.md`，并运行 `install\01-check.cmd` 自检；
        请勿在 Issue 中粘贴未脱敏的工程路径、用户名或客户数据名称。

  - type: input
    id: addin_version
    attributes:
      label: 客户版 / add-in 版本
      description: 例如 v1.1.4（add-in 1.1.4.0）；可在 README 或 VERSION.json 中查看
      placeholder: v1.1.4 (add-in 1.1.4.0)
    validations:
      required: true

  - type: input
    id: pro_version
    attributes:
      label: ArcGIS Pro 版本
      description: 例如 3.7
      placeholder: "3.7"
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows 版本
      description: 本客户版仅支持 Windows 11 x64（不支持 ARM64）
      placeholder: Windows 11 x64 24H2

  - type: textarea
    id: check_output
    attributes:
      label: 01-check.cmd 输出
      description: 粘贴自检输出（通过/警告/失败统计）。若无法运行，请粘贴报错信息或说明原因
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出操作步骤，越具体越好
      placeholder: |
        1. 打开 ArcGIS Pro 并加载工程
        2. 在 AI 客户端中发送 "…"
        3. 观察到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      render: text

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 报错堆栈
      description: 如有 arcpy 报错、MCP 通信日志或 add-in 日志，请粘贴相关片段
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 例如 MCP 通信日志、%LOCALAPPDATA%\ArcGIS Pro MCP\ 下的日志；请先脱敏
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: 脱敏确认
      options:
        - label: 我已删除用户名、工程路径、客户数据名称、令牌等敏感信息
          required: true

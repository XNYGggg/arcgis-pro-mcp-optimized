name: 功能建议
description: 建议新增工具、改进工作流或完善文档
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。当前稳定线为 v1.1.4，2.x 为测试线（不提供下载）；请说明你的场景，便于判断优先级。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 遇到的问题
      description: 你正在做什么、现有能力哪里不够用
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或改进
      description: 尽量描述输入、输出与期望行为；如涉及新工具，请给出工具名与参数设想
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 例如用 run_geoprocessing_tool / RunCode 临时绕过的方法
      render: text

  - type: input
    id: version
    attributes:
      label: 当前客户版版本
      description: 例如 v1.1.4
      placeholder: v1.1.4

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: CLI smoke
        run: |
          arcgis-guard doctor
          arcgis-distill doctor
      - name: Tests
        run: python -m pip install pytest && python -m pytest -q
